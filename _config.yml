title: eduroam Korea
title_en: eduroam Korea
description: 대한민국 eduroam 국가 로밍 운영기관(NRO) 안내
description_en: National Roaming Operator for eduroam in the Republic of Korea

remote_theme: eduroam-kr/multipage-jekyll-site-theme@v1.7
brand: Korea
bilingual: true

url: "https://eduroam.kreonet.net"
baseurl: ""

# 빌드는 UTC 인 CI 에서 돈다. 이걸 비워 두면 오늘 날짜로 쓴 공지가 "미래"가 되어
# 목록에는 뜨는데 페이지는 만들어지지 않는다. future 는 그 사고를 한 번 더 막는다.
timezone: Asia/Seoul
future: true

# 기관 데이터는 eduroam-kr-db 가 낸다. 빌드할 때 _data/ 로 받아 온다.
db_url: "https://db.eduroam.kreonet.net"

# 기관 이름과 주소는 쓰이는 자리에 직접 적는다. 여기 모아 두고 치환하면 문장을
# 읽어도 무엇이 나올지 알 수 없다. 여러 쪽에서 같이 쓰는 연락처만 남긴다.
nro:
  # 화면에는 난독화한 값만 쓴다. 메일 주소를 그대로 적으면 수집 로봇이 긁어 간다.
  # mailto:, tel: 링크도 같은 이유로 걸지 않는다.
  email: "eduroam-kr-nro-ops __at__ lists.kreonet.net"
  # 전화번호의 하이픈은 U+2012 피겨 대시다. 수집기 정규식이 보통 [-.\s] 만 보므로
  # 걸러진다. 보기에는 하이픈과 거의 같다.
  tel: "042‒869‒1292"

# 홈 화면의 공지 블록은 이 기간이 지나면 화면에서 사라진다 (assets/js/notice.js).
# HTML 에는 남아 있어서 크롤러와 페이지 소스에서는 보인다.
notice_fresh_days: 90

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

collections:
  notices:
    output: true
    permalink: /notices/:name/

defaults:
  - scope: { path: "", type: notices }
    values: { layout: notice, lang: ko, lang_alt: /en/notices/ }

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
