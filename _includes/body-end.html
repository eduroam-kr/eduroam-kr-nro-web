{%- comment -%}
  레이아웃이 라이브러리를 본문 뒤에 불러오므로, 본문 안에 <script src> 를 두면
  라이브러리보다 먼저 돈다. 페이지가 쓰는 스크립트는 front matter 로 켜고
  여기서 순서대로 불러온다 (map: true, notice_js: true).
{%- endcomment -%}
{%- if page.map %}
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ '/assets/js/map.js' | relative_url }}"></script>
<script src="{{ '/assets/js/list.js' | relative_url }}"></script>
{%- endif %}
{%- if page.notice_js %}
<script src="{{ '/assets/js/notice.js' | relative_url }}"></script>
{%- endif %}
<script src="{{ '/assets/js/live.js' | relative_url }}"></script>
